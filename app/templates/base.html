<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SAT Study Lab{% endblock %}</title>
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png">
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/app.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Desmos API -->
    <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
    
    <!-- Theme Script -->
    <script>
        if (localStorage.getItem('sat_lab_theme') === 'dark' || (!('sat_lab_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 min-h-screen flex antialiased selection:bg-indigo-200 dark:selection:bg-indigo-900 selection:text-indigo-900 dark:selection:text-indigo-100">
    
    <!-- Sidebar -->
    <aside class="w-64 fixed inset-y-0 left-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl border-r border-gray-200/50 dark:border-gray-800/50 flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-gray-200/50 dark:border-gray-800/50">
            <i data-lucide="graduation-cap" class="w-6 h-6 text-indigo-600 dark:text-indigo-400 mr-2"></i>
            <span class="text-lg font-semibold tracking-tight">SAT Study Lab</span>
        </div>
        
        <nav class="flex-1 py-4 flex flex-col gap-1 overflow-y-auto px-3">
            <a href="/" class="nav-link flex items-center px-3 py-2 rounded-r-lg text-sm font-medium text-gray-700 dark:text-gray-300 {% if request.path == '/' %}active{% endif %}">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i> Dashboard
            </a>
            <a href="/papers" class="nav-link flex items-center px-3 py-2 rounded-r-lg text-sm font-medium text-gray-700 dark:text-gray-300 {% if request.path.startswith('/papers') %}active{% endif %}">
                <i data-lucide="file-text" class="w-5 h-5 mr-3"></i> Practice Papers
            </a>
            <a href="/bank" class="nav-link flex items-center px-3 py-2 rounded-r-lg text-sm font-medium text-gray-700 dark:text-gray-300 {% if request.path.startswith('/bank') %}active{% endif %}">
                <i data-lucide="database" class="w-5 h-5 mr-3"></i> Question Bank
            </a>
            <a href="/vocab" class="nav-link flex items-center px-3 py-2 rounded-r-lg text-sm font-medium text-gray-700 dark:text-gray-300 {% if request.path.startswith('/vocab') %}active{% endif %}">
                <i data-lucide="library" class="w-5 h-5 mr-3"></i> Vocab Center
            </a>
            <a href="/courses" class="nav-link flex items-center px-3 py-2 rounded-r-lg text-sm font-medium text-gray-700 dark:text-gray-300 {% if request.path.startswith('/courses') %}active{% endif %}">
                <i data-lucide="book-open" class="w-5 h-5 mr-3"></i> AI Courses
            </a>
            <a href="/analytics" class="nav-link flex items-center px-3 py-2 rounded-r-lg text-sm font-medium text-gray-700 dark:text-gray-300 {% if request.path.startswith('/analytics') %}active{% endif %}">
                <i data-lucide="bar-chart-2" class="w-5 h-5 mr-3"></i> Analytics
            </a>
            
            <div class="mt-auto">
                <a href="/sources" class="nav-link flex items-center px-3 py-2 rounded-r-lg text-sm font-medium text-gray-700 dark:text-gray-300 {% if request.path.startswith('/sources') %}active{% endif %}">
                    <i data-lucide="shield-check" class="w-5 h-5 mr-3"></i> Sources & Compliance
                </a>
            </div>
        </nav>
    </aside>
    
    <!-- Main Content -->
    <div class="flex-1 ml-64 flex flex-col min-h-screen">
        <!-- Topbar -->
        <header class="h-16 sticky top-0 z-40 bg-white/60 dark:bg-gray-950/60 backdrop-blur-md border-b border-gray-200/50 dark:border-gray-800/50 flex justify-end items-center px-8">
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-gray-500 dark:text-gray-400">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
            </button>
        </header>
        
        <!-- Main Area -->
        <main class="flex-1 p-8">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Scripts -->
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
        
        // Theme Toggle Logic
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('sat_lab_theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('sat_lab_theme', 'dark');
            }
        });
    </script>
    
    <!-- App JS -->
    <script src="/static/js/app.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
